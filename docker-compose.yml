services:
  mysql-db:
    image: mysql:8.0
    container_name: ops-engine-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-enterprise_ops_db}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS:-rootpassword}"]
      interval: 5s
      timeout: 5s
      retries: 15

  fastapi-backend:
    build: .
    container_name: ops-engine-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ${DB_PASS:-rootpassword}
      DB_NAME: ${DB_NAME:-enterprise_ops_db}
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/workspace/chroma_db
    depends_on:
      mysql-db:
        condition: service_healthy
    command: >
      sh -c "python seed.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  streamlit-ui:
    build: .
    container_name: ops-engine-ui
    restart: unless-stopped
    environment:
      API_BASE_URL: http://fastapi-backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - fastapi-backend
    command: >
      streamlit run ui/dashboard.py --server.port 8501 --server.address 0.0.0.0

volumes:
  mysql_data:
  chroma_data: